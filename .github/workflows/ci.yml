name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps for offline smoke tests
        run: pip install langchain-text-splitters networkx pytest python-dotenv
      - name: Run smoke tests (no Qdrant / no API key required)
        run: pytest tests/test_smoke.py -q
